# Render's free plan puts the API to sleep after 15 minutes without traffic, and
# waking it (loading the model) takes about a minute. This pings /health every
# 10 minutes so visitors rarely hit a cold start. One always-on free service fits
# in Render's 750 free instance hours a month. GitHub pauses scheduled workflows
# after 60 days without repository activity; re-enable it from the Actions tab.
name: keep-backend-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://maisproject.onrender.com/health
